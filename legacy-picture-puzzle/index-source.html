<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#81c9f6"><title>Sparky's Picture Puzzle</title><link rel="stylesheet" href="game.css?v=quiet-garden-clear-2"></head><body>
<main class="game" aria-label="Sparky's picture puzzle">
<button id="sound" class="game-button sound" aria-label="Mute sound" aria-pressed="false"><img src="assets/icons/sound-on.png" alt="" draggable="false"></button>
<button id="exit" class="game-button exit" aria-label="Pause game"><img src="assets/icons/close.png" alt="" draggable="false"></button>
<div class="mascot"><canvas id="mascot" width="512" height="640" aria-label="Sparky, your animated puzzle friend"></canvas><div class="shadow"></div><button id="mascot-button" type="button" aria-label="Play with Sparky" title="Play with Sparky"></button></div>
<p id="progress" class="puzzle-progress" aria-label="Puzzle progress"></p>
<section class="puzzle-frame" aria-label="Picture puzzle"><div id="board" class="board" role="group" aria-label="Drag a strip onto another strip to swap their positions"></div></section>

<button id="next" class="game-button next" aria-label="Next picture" disabled><img src="assets/icons/next.png" alt="" draggable="false"></button>
<audio id="background-music" src="assets/audio/daylight-on-the-carpet.mp3" loop preload="metadata" aria-hidden="true"></audio>
<div id="confetti" aria-hidden="true"></div><p id="status" class="sr-only" role="status" aria-live="polite"></p>
<div id="loading" class="loading"><span>✦</span><p aria-label="Loading puzzle">● ● ●</p></div>
<dialog id="pause-dialog"><h1 class="sr-only">Game paused</h1><button id="resume" aria-label="Resume game"><img src="assets/icons/play.png" alt=""></button><button id="restart" aria-label="Shuffle this puzzle"><img src="assets/icons/restart.png" alt=""></button></dialog>
</main><script type="module" src="game.js?v=more-reactions-1"></script></body></html>
