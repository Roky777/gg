<script src="../../sparky-animations%204/vendor/spine-webgl.min.js"></script><script type="module">
import {SparkyRigPlayer}from '../../sparky-animations%204/rig-player.js';import {loadCandidate}from './load-candidate.js';
const [old,newRig]=await Promise.all([SparkyRigPlayer.load('../../sparky-animations%204/manifest.json'),loadCandidate('../../sparky-animations%204/manifest.json')]);
const sel=document.querySelector('#clip');sel.innerHTML=newRig.manifest.animations.map(a=>`<option value="${a.name}">${a.title}</option>`).join('');sel.value='0Final/Idle/Idle_EB';
const views=[old.add(document.querySelector('#before'),sel.value,{loop:true,baseClip:sel.value}),newRig.add(document.querySelector('#after'),sel.value,{loop:true,baseClip:sel.value})];let paused=true;old.setPaused(true);newRig.setPaused(true);views.forEach(v=>v.seek(0));
sel.onchange=()=>{views.forEach(v=>{v.setAnimation(sel.value,{loop:true,mixSeconds:0});v.seek(0);});document.querySelector('#time').value=0;};document.querySelector('#play').onclick=e=>{paused=!paused;old.setPaused(paused);newRig.setPaused(paused);if(!paused)views.forEach(v=>v.restart());e.target.textContent=paused?'Play':'Pause';};document.querySelector('#time').oninput=e=>{old.setPaused(true);newRig.setPaused(true);paused=true;document.querySelector('#play').textContent='Play';const d=newRig.manifest.animations.find(a=>a.name===sel.value).duration;views.forEach(v=>v.seek(d*+e.target.value));};document.querySelector('#speed').onchange=e=>{old.setSpeed(+e.target.value);newRig.setSpeed(+e.target.value);};document.querySelector('#mesh').onclick=e=>{newRig.showMesh=!newRig.showMesh;views.forEach(v=>v.seek(0));e.target.textContent=newRig.showMesh?'Hide mesh':'Show mesh';};document.querySelector('#background').onclick=()=>document.body.classList.toggle('light');
</script>
