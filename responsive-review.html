<!doctype html><meta charset="utf-8"><title>Responsive layout review</title><style>body{margin:16px;background:#182b3b;color:white;font:15px system-ui}button,select{font:inherit;margin:5px;padding:8px}iframe{display:block;border:2px solid #9bced0;background:#8bdaf4;flex-shrink:0}#results{white-space:pre-wrap;max-width:900px}.preview{overflow:auto;max-height:85vh}</style><h1>Responsive layout review</h1><select id="size"></select><select id="mode"></select><button id="show">Preview</button><button id="run">Check all layouts</button><p id="results"></p><div class="preview" id="preview"></div><script type="module">
const sizes=[[320,568],[360,640],[390,844],[430,932],[568,320],[844,390],[956,440],[667,375],[768,1024],[1024,768],[1440,900]],modes=['letters','numbers','assembly','counting','differences','balloon-pop','jelly-wiggle'];
size.innerHTML=sizes.map(([w,h],i)=>`<option value="${i}">${w} × ${h}</option>`).join('');mode.innerHTML=modes.map(m=>`<option>${m}</option>`).join('');
const query=new URLSearchParams(location.search);if(query.has('size'))size.value=query.get('size');if(query.has('mode'))mode.value=query.get('mode');
let frame;async function load(s,m){frame?.remove();frame=document.createElement('iframe');frame.width=s[0];frame.height=s[1];frame.src=m==='counting'?'counting-state-review.html?state=empty&v=answer-fit-42':`index.html?game=${m}&review=board-ribbon-43`;preview.replaceChildren(frame);await new Promise(r=>frame.onload=r);for(let i=0;i<150;i++){if(frame.contentDocument.querySelector('#loading')?.hidden)break;await new Promise(r=>setTimeout(r,100));}if(!frame.contentDocument.querySelector('#loading')?.hidden)throw Error('Game did not finish loading');await frame.contentDocument.fonts.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));if(query.has('banner')){const b=frame.contentDocument.querySelector('#round-banner');b.hidden=false;b.style.setProperty('display','grid','important');b.style.setProperty('animation','none','important');}return frame.contentDocument;}
function audit(d,s,m){let errors=[];const rect=e=>e.getBoundingClientRect(),inside=(a,b)=>a.left>=b.left-2&&a.top>=b.top-2&&a.right<=b.right+2&&a.bottom<=b.bottom+2;
if(s[1]>s[0]){if(d.defaultView.getComputedStyle(d.querySelector('.rotate-prompt')).display==='none')errors.push('rotate prompt missing');if(!d.querySelector('.game').inert)errors.push('portrait game active');return errors;}
const game=rect(d.querySelector('.game')),board=rect(d.querySelector('.board')),frame=rect(d.querySelector('.puzzle-frame'));
const overlap=(a,b)=>a.left<b.right-1&&a.right>b.left+1&&a.top<b.bottom-1&&a.bottom>b.top+1;
for(const e of d.querySelectorAll('.game-button'))if(overlap(rect(e),frame))errors.push(e.id+' overlaps board');
const canvas=d.querySelector('#mascot'),pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;let minX=canvas.width,minY=canvas.height,maxX=-1,maxY=-1;
for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++)if(pixels[(y*canvas.width+x)*4+3]>40){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}
if(maxX<0)errors.push('Sparky did not render');if(maxX>=0){const c=rect(canvas),scale=Math.min(c.width/canvas.width,c.height/canvas.height),left=c.left+(c.width-canvas.width*scale)/2,top=c.top+(c.height-canvas.height*scale)/2,ink={left:left+minX*scale,right:left+(maxX+1)*scale,top:top+minY*scale,bottom:top+(maxY+1)*scale};if(!inside(ink,game))errors.push('Sparky clipped');if(overlap(ink,frame))errors.push('Sparky overlaps board');for(const e of d.querySelectorAll('.game-button'))if(overlap(ink,rect(e)))errors.push('Sparky overlaps '+e.id);}
for(const e of d.querySelectorAll('.game-button')){const a=rect(e);if(a.width<44||a.height<44)errors.push(e.id+' target below 44px');if(!inside(a,game))errors.push(e.id+' clipped');}if(!inside(rect(d.querySelector('.puzzle-frame')),game))errors.push('frame clipped');if(d.documentElement.scrollWidth>s[0]+1)errors.push('horizontal overflow');
for(const e of d.querySelectorAll('.quantity-rows,.difference-pictures,.assembly-tray'))if(e.scrollHeight>e.clientHeight+2)errors.push(e.className+' vertical overflow');
if((m==='balloon-pop'||m==='jelly-wiggle')&&!inside(board,frame))errors.push('play area outside frame');
if(m==='balloon-pop'||m==='jelly-wiggle')for(const e of d.querySelectorAll('.fun-toy')){if(!inside(rect(e),board))errors.push('play object outside board');if(rect(e).width<44||rect(e).height<44)errors.push('play object target below 44px');}
if(m==='letters'||m==='numbers')for(const e of d.querySelectorAll('.piece'))if(!inside(rect(e),board))errors.push('card outside board');
if(m==='assembly')for(const e of d.querySelectorAll('.assembly-art,.assembly-choice'))if(!inside(rect(e),board))errors.push(e.className+' outside board');
if(m==='counting'){
 for(const e of d.querySelectorAll('.number-chip,.quantity-row'))if(!inside(rect(e),board))errors.push(e.className+' outside board');
 for(const dock of d.querySelectorAll('.quantity-dock')){const a=rect(dock);if(!inside(a,rect(dock.parentElement)))errors.push('answer outside its row');if(Math.abs(a.width-a.height)>1)errors.push('answer box stretched');}
 for(const art of d.querySelectorAll('.quantity-dock .number-art,.object-ordinal .number-art,.number-chip:not(.used) .number-art'))if(!inside(rect(art),rect(art.parentElement)))errors.push('number artwork overflows '+art.parentElement.className);
}

if(query.has('banner')){const b=rect(d.querySelector('#round-banner'));if(!inside(b,frame))errors.push('ribbon outside board');if(Math.abs((b.left+b.right-frame.left-frame.right)/2)>1)errors.push('ribbon off center');for(const e of d.querySelectorAll('.difference-image-wrap'))if(overlap(b,rect(e)))errors.push('ribbon overlaps photo');}
if(m==='differences')for(const e of d.querySelectorAll('.difference-panel'))if(!inside(rect(e),board))errors.push('photo outside board');
return [...new Set(errors)];}
show.onclick=async()=>{const s=sizes[+size.value],m=mode.value;try{const d=await load(s,m);if(m==='counting')d.defaultView.reviewCountingState(query.get('state')||'partial');await new Promise(r=>setTimeout(r,300));results.textContent=`${s.join(' × ')} ${m}: ${audit(d,s,m).join('; ')||'PASS'}`;}catch(e){results.textContent=e.message;}};
run.onclick=async()=>{run.disabled=true;let lines=[],fails=0,total=0;for(const s of sizes)for(const m of modes){try{const d=await load(s,m);for(const state of m==='counting'?['empty','counted','partial','complete']:['initial']){if(m==='counting')d.defaultView.reviewCountingState(state);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const e=audit(d,s,m);total++;fails+=e.length?1:0;lines.push(`${s.join('×')} ${m} ${state}: ${e.join('; ')||'PASS'}`);results.textContent=lines.join('\n');}}catch(e){total++;fails++;lines.push(`${s.join('×')} ${m}: FAIL ${e.message}`);}}results.textContent=`${total-fails}/${total} state layouts passed\n`+lines.join('\n');run.disabled=false;};if(query.has('run'))run.click();else show.click();
</script>
