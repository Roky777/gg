<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sparky developer menu</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf5f7;color:#254e68;font:16px system-ui,sans-serif}main{max-width:1050px;margin:40px auto;padding:24px}h1{font-size:28px;margin:0 0 8px}p{line-height:1.5}nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:26px 0}nav a{display:flex;flex-direction:column;gap:6px;padding:20px;border:2px solid #a2cbdf;border-radius:16px;background:#fffdf4;color:#225d7b;text-decoration:none;box-shadow:0 3px #accbda}nav a:hover,nav a:focus-visible{outline:3px solid #efb551;outline-offset:2px}small{font-size:12px;color:#617d8d}a{color:#176b99}</style></head>
<body><main><h1>Sparky developer menu</h1><p>Select a game to preview. This menu is separate from the player screens.</p><nav aria-label="Game previews" id="games"><a href="./?game=all"><strong>Play all 13 games</strong><small>One sequence, with Next available on every board</small></a></nav></main>
<script type="module">import{EXISTING,VARIANTS}from'./variants/content.js';const current=new URLSearchParams(location.search).get('game');for(const spec of[...EXISTING,...VARIANTS]){const a=document.createElement('a'),name=document.createElement('strong'),id=document.createElement('small');a.href='./?game='+encodeURIComponent(spec.id);name.textContent=spec.title;id.textContent=spec.id;if(spec.id===current)a.setAttribute('aria-current','page');a.append(name,id);document.getElementById('games').append(a);}</script></body></html>
