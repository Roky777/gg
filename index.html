<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#81c9f6"><link rel="preload" href="assets/fonts/Nunito-Variable.ttf" as="font" type="font/ttf" crossorigin><title>Sparky’s Picture Ordering Adventures</title><link rel="stylesheet" href="game.css?v=lip-sync-40"><link rel="stylesheet" href="responsive.css?v=count-card-fit-45"><link rel="stylesheet" href="controls.css?v=garden-controls-46"><link rel="stylesheet" href="play-breaks.css?v=play-breaks-48"></head><body>
<aside class="rotate-prompt" role="status" aria-label="Rotate your phone to play"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="31" y="15" width="38" height="70" rx="7" transform="rotate(-25 50 50)"/><path d="M18 38a34 34 0 0 1 61-15m-1-12 3 15-15-1M82 62a34 34 0 0 1-61 15m1 12-3-15 15 1"/></svg><h1>Rotate your phone</h1><p>Turn your phone sideways to play with Sparky.</p></aside>
<main class="game" aria-label="Sparky’s learning picture puzzle">
<button id="sound" class="game-button sound" aria-label="Mute sound" aria-pressed="false"><img src="assets/art/ui-controls/sound-on-v1.svg" alt="" draggable="false"></button>
<button id="exit" class="game-button exit" aria-label="Pause game"><img src="assets/art/ui-controls/pause-v1.svg" alt="" draggable="false"></button>
<div class="sr-only"><p id="learning-caption"></p><small id="voice-note"></small><strong id="task-rule"></strong></div>
<div class="mascot"><canvas id="mascot" width="512" height="640" aria-label="Sparky, your animated puzzle friend"></canvas><div class="shadow"></div><button id="mascot-button" type="button" aria-label="Hear Sparky’s matching instructions" title="Tap Sparky to hear what to do"></button></div>
<p id="progress" class="sr-only" aria-label="Puzzle progress"></p>
<section class="puzzle-frame" aria-label="Picture puzzle"><div id="board" class="board" role="group" aria-label="Swap the whole pictures into learning order"></div><div id="round-banner" class="round-banner" role="status" aria-live="polite" aria-atomic="true" hidden><img src="assets/art/ui-board/round-ribbon.png" alt="" draggable="false"><span id="round-banner-title" lang="en"></span></div></section>


<button id="next" class="game-button next" aria-label="Next learning picture"><img src="assets/art/ui-controls/next-v1.svg" alt="" draggable="false"></button>
<audio id="background-music" src="assets/audio/Sunny_Afternoon_Meadow.mp3" loop preload="metadata" aria-hidden="true"></audio>
<div id="confetti" aria-hidden="true"></div><p id="status" class="sr-only" role="status" aria-live="polite"></p>
<div id="loading" class="loading" role="status" aria-live="polite" aria-label="Loading game"><span aria-hidden="true">✦</span><h1>Let’s play with Sparky!</h1><p>Loading your first puzzle…</p></div>
<dialog id="pause-dialog"><h1 class="sr-only">Game paused</h1><button id="resume" aria-label="Resume game"><img src="assets/icons/play.png" alt=""></button><button id="restart" aria-label="Shuffle this puzzle"><img src="assets/icons/restart.png" alt=""></button></dialog>
</main><script type="module" src="game.js?v=progressive-loading-49"></script></body></html>
