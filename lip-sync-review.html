<!doctype html><meta charset="utf-8"><title>Sparky speech review</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:24px;background:#202832;color:#edf7fa;font:16px system-ui}button{padding:12px;margin:5px;border:0;border-radius:12px;background:#81d4dc;font:inherit}main{display:flex;gap:20px;align-items:start}#demo{width:360px;height:450px}#shapes{display:grid;grid-template-columns:repeat(4,150px);gap:10px}figure{margin:0;background:#2b3540;border-radius:16px;text-align:center;padding:8px}figure canvas{width:135px;height:170px}#state{font-variant-numeric:tabular-nums;white-space:pre-wrap}</style><h1>Sparky speech review</h1><button id="help">Play help</button><button id="count">Count 1–3</button><button id="cheer">Celebrate</button><button id="stop">Stop</button><p id="state">Loading rig…</p><main><canvas id="demo" width="512" height="640"></canvas><section id="shapes"></section></main><script type="module">
import {SparkyRigPlayer} from './sparky-animations%204/rig-player.js?v=lip-sync-40';import {MascotDirector,CLIPS} from './mascot-director.js?v=lip-sync-40';import{LearningVoice}from './learning-voice.js?v=lip-sync-40';import{CompanionPose}from './companion-pose.js';import{voiceGesture}from './lip-sync.js';
const d=new MascotDirector(demo,CLIPS),pose=new CompanionPose();d.setPoseModifier((s,f)=>pose.apply(s,f));const voice=new LearningVoice({onStart(cue){d.setSpeaking(true);const g=voiceGesture(cue.category);if(g)pose.act(g);},onEnd(){d.setSpeaking(false);},onUnavailable(){state.textContent='Audio unavailable';}});d.setSpeechSource(()=>voice.speechFrame());await d.ready;await d.show('idle');state.textContent='Ready';
const rig=d.rig;for(const shape of 'XABCDEF'){const fig=document.createElement('figure'),c=document.createElement('canvas'),label=document.createElement('figcaption');label.textContent=shape;fig.append(c,label);shapes.append(fig);const actor=rig.add(c,CLIPS.idle,{baseClip:CLIPS.idle});actor.seek(0);actor.setSpeechSource(()=>({shape,playing:true,time:0}));actor.setSpeech(true);}
help.onclick=()=>{voice.unlock();voice.say('assembly_help_02');};count.onclick=()=>{voice.unlock();voice.saySequence(['number_01','number_02','number_03']);};cheer.onclick=()=>{voice.unlock();d.react('yes',{seconds:1.8});voice.say('letters_win_01');};stop.onclick=()=>{voice.cancel();pose.clear();d.show('idle');};
function tick(){const f=voice.speechFrame();state.textContent=f?`${f.id} | ${f.time.toFixed(2)} s | mouth ${f.shape} | ${f.playing?'playing':'closed / buffering'}`:'Ready / silent';requestAnimationFrame(tick);}tick();
</script>
