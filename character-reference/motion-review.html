<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original Sparky · motion checks</title>
<style>body{background:#17232c;color:#eef7f6;font:16px system-ui;margin:24px}h1{font-size:24px}.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1200px}.stage{aspect-ratio:4/5;background:#222a35;border-radius:18px;overflow:hidden}.stage canvas{width:100%;height:100%;object-fit:contain}h2{font-size:16px}#status{color:#b6dccc}</style>
<h1>Original Sparky · motion checks</h1><p>Original reference artwork on a separate weighted rig. Motion retargeting is under review.</p><p id="status">Loading…</p><div class="views" id="views"></div>
<script src="../sparky-animations%204/vendor/spine-webgl.min.js"></script><script type="module">
import {ReferenceRigPlayer} from './reference-player.js';import {installReferenceRig} from './retarget.js';
const r=await ReferenceRigPlayer.load('../sparky-animations%204/manifest.json');await installReferenceRig(r);r.setPaused(true);
const samples=[['Neutral','0Final/Idle/Idle_EB',0],['Clap','0Final/Appreciation/Clapping',.75],['Hurray','0Final/Appreciation/Hurray',.8],['Guide','0Final/Vocal/Let’s add some sprinkles!',.8],['Think','0Final/Vocal/I wonder what magical flavor',.8],['Wow','0Final/Wow_2',.8]];
for(const [title,clip,time]of samples){const section=document.createElement('section');section.innerHTML=`<h2>${title}</h2><div class="stage"><canvas width="512" height="640"></canvas></div>`;document.querySelector('#views').append(section);r.add(section.querySelector('canvas'),clip,{loop:false}).seek(time);}
document.querySelector('#status').textContent='Six fixed poses · source colours and proportions · animation refit still in progress';
</script>
