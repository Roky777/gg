<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sparky reference character review</title><style>body{background:#17232c;color:#eef7f6;font:16px system-ui;margin:24px}h1{font-size:24px}button,select,input{font:inherit;padding:9px;margin:4px}.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:1300px}.stage{position:relative;aspect-ratio:4/5;background:#222a35;border-radius:20px;overflow:hidden}.stage canvas{width:100%;height:100%;object-fit:contain}.stage img{position:absolute;height:80%;width:auto;bottom:9%;left:50%;transform:translateX(-50%)}.light .stage{background:#e7eff1}h2{font-size:16px}.stage:after{content:'';position:absolute;left:8%;right:8%;bottom:9%;border-bottom:1px solid #73838c66;pointer-events:none}#status{color:#b6dccc}</style>
<h1>Sparky · reference sports character</h1><p>Original reference, current game artwork and candidate on the same animation timing.</p><select id="clip"></select><button id="pause">Play</button><button id="background">Light background</button><label>Time <input id="time" type="range" min="0" max="1" step=".001" value="0"></label><div id="status">Loading rig…</div>
<div class="views"><section><h2>Original reference</h2><div class="stage"><img src="source/reference-model.png" id="reference"></div></section><section><h2>Current game character</h2><div class="stage"><canvas id="before" width="512" height="640"></canvas></div></section><section><h2>Original artwork · retarget review</h2><div class="stage"><canvas id="after" width="512" height="640"></canvas></div></section></div>
<script src="../sparky-animations%204/vendor/spine-webgl.min.js"></script><script type="module">
import {SparkyRigPlayer} from '../sparky-animations%204/rig-player.js?v=lip-sync-40';
import {ReferenceRigPlayer} from './reference-player.js';
import {installReferenceRig} from './retarget.js';
const [oldRig,newRig]=await Promise.all([SparkyRigPlayer.load('../sparky-animations%204/manifest.json'),ReferenceRigPlayer.load('../sparky-animations%204/manifest.json')]);
await installReferenceRig(newRig);
const select=document.querySelector('#clip');select.innerHTML=newRig.manifest.animations.map(a=>`<option value="${a.name}">${a.title}</option>`).join('');select.value='0Final/Idle/Idle_EB';
const views=[oldRig.add(document.querySelector('#before'),select.value,{loop:true}),newRig.add(document.querySelector('#after'),select.value,{loop:true})];
oldRig.setPaused(true);newRig.setPaused(true);views.forEach(v=>v.seek(.01));let paused=true;
select.onchange=()=>{for(const v of views){v.setAnimation(select.value,{loop:true});v.seek(0);}document.querySelector('#time').value=0;};
document.querySelector('#pause').onclick=e=>{paused=!paused;oldRig.setPaused(paused);newRig.setPaused(paused);if(!paused)views.forEach(v=>v.play());e.target.textContent=paused?'Play':'Pause';};
document.querySelector('#time').oninput=e=>{oldRig.setPaused(true);newRig.setPaused(true);paused=true;document.querySelector('#pause').textContent='Play';const duration=newRig.manifest.animations.find(a=>a.name===select.value).duration;views.forEach(v=>v.seek(duration*+e.target.value));};
document.querySelector('#background').onclick=()=>document.body.classList.toggle('light');document.querySelector('#status').textContent=newRig.manifest.animations.length+' original clips · original reference pixels · retarget review · not yet promoted';
</script>
