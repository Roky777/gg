<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sparky companion pose review</title><style>@font-face{font-family:Nunito;src:url('assets/fonts/Nunito-Variable.ttf')}*{box-sizing:border-box}body{margin:0;background:#202c37;color:#fff;font-family:Nunito,sans-serif;padding:24px}h1{font-size:24px;margin:0}p{color:#b9d3d5}main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}section{background:#2b3b48;border-radius:20px;padding:16px;text-align:center}canvas{width:100%;height:auto;display:block}h2{font-size:20px}a{color:#ffe6a1}</style><h1>Sparky companion · pose review</h1><p>Fixed poses for checking the arm joins, attention, and speaking face. <a href="index.html?v=mouth-replace-36">Play the game</a></p><main><section><h2>Greeting wave</h2><canvas id="wave"></canvas></section><section><h2>Guide toward the board</h2><canvas id="guide"></canvas></section><section><h2>Speaking while guiding</h2><canvas id="speech"></canvas></section></main><p id="state">Loading Sparky…</p><script type="module">
import {SparkyRigPlayer} from './sparky-animations%204/rig-player.js?v=mouth-replace-36';import {CompanionPose} from './companion-pose.js?v=mouth-replace-36';
try{const rig=await SparkyRigPlayer.load('./sparky-animations%204/manifest.json');rig.setPaused(true);

</script></html>
